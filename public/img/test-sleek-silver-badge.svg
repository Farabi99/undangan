<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="75%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="35%" stop-color="#F7E7C4"/>
      <stop offset="75%" stop-color="#DFBE76"/>
      <stop offset="100%" stop-color="#B8943D"/>
    </linearGradient>
  </defs>

  <circle cx="250" cy="250" r="248" fill="#080E1C" stroke="rgba(226, 232, 240, 0.5)" stroke-width="1.5"/>

  <!-- Sleek Minimalist Hairline Ring (Exact Reference Style) -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#silverGrad)" stroke-width="1.8" filter="url(#softGlow)"/>

  <!-- Subtle Inner Hairline Ring for Depth -->
  <circle cx="250" cy="250" r="217" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="0.75"/>

  <!-- Monogram Lockup in Pure Editorial Haute-Couture Style -->
  <g filter="url(#softGlow)">
    
    <!-- ==================== LETTER F ==================== -->
    <!-- Base serif of F -->
    <path d="
      M 168 375 
      L 232 375 
      L 232 368 
      C 223 368, 218 365, 214 358 
      L 214 142 
      C 218 135, 223 132, 232 132 
      L 232 125 
      L 178 125 
      L 178 132 
      C 187 132, 192 135, 196 142 
      L 196 358 
      C 192 365, 187 368, 168 368 
      Z" 
      fill="#FFFFFF" />

    <!-- Top Arm of F with sleek vertical serif terminal -->
    <path d="
      M 214 125 
      L 332 125 
      L 332 152 
      L 325 152 
      C 322 138, 316 133, 298 133 
      L 214 133 
      Z" 
      fill="#FFFFFF" />

    <!-- Middle Crossbar of F -->
    <path d="
      M 204 238 
      L 282 238 
      L 282 254 
      L 276 254 
      C 273 244, 268 243, 252 243 
      L 204 243 
      Z" 
      fill="#FFFFFF" />

    <!-- ==================== LETTER S ==================== -->
    <!-- Gracefully intertwined with F: sweeps behind top bar, crosses over stem, sweeps behind base -->
    <!-- Rendered with high-contrast Didone stroke swelling -->
    <path d="
      M 338 184
      C 334 154, 308 128, 268 128
      C 232 128, 208 146, 208 174
      C 208 198, 226 214, 264 228
      C 312 246, 344 272, 344 316
      C 344 362, 300 385, 246 385
      C 202 385, 168 362, 156 326
      L 178 318
      C 188 348, 212 369, 246 369
      C 290 369, 324 345, 324 315
      C 324 280, 298 259, 254 242
      C 208 224, 186 202, 186 170
      C 186 130, 222 113, 268 113
      C 310 113, 340 132, 348 170
      Z"
      fill="url(#silverGrad)"
      stroke="#080E1C"
      stroke-width="1.2"
    />

    <!-- Overlap definition: S crossing in FRONT of F's vertical stem between y=230 and y=270 -->
    <!-- Crisp knockout bridge ensuring high-fashion clarity -->
    <path d="
      M 218 210
      C 232 216, 246 222, 260 228
      C 274 234, 288 241, 298 249
      L 292 262
      C 280 253, 268 246, 254 240
      C 240 234, 226 228, 214 222
      Z"
      fill="url(#silverGrad)"
      stroke="#080E1C"
      stroke-width="1.2"
    />
  </g>
</svg>