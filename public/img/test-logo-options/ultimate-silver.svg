      L 295 138 
      L 278 138 
      C 275 120, 264 114, 238 114 
      L 204 114 
      L 204 220 
      L 258 220 
      C 272 220, 278 215, 280 202 
      L 290 202 
      L 290 250 
      L 280 250 
      C 278 238, 272 234, 258 234 
      L 204 234 
      L 204 350 
      C 204 372, 212 378, 236 380 
