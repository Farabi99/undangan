    <!-- Teardrop Pearl Terminals on S -->
    <circle cx="374" cy="190" r="9" fill="#FFFFFF" stroke="#080E1C" stroke-width="1"/>
    <circle cx="188" cy="388" r="9" fill="url(#sGradSilver)" stroke="#080E1C" stroke-width="1"/>

