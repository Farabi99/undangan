<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="metalGrad" x1="20%" y1="10%" x2="80%" y2="90%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="28%" stop-color="#F8FAFC" />
        <stop offset="58%" stop-color="#E2E8F0" />
        <stop offset="82%" stop-color="#CBD5E1" />
        <stop offset="100%" stop-color="#94A3B8" />
       </linearGradient>
       <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="50%" stop-color="#CBD5E1" />
        <stop offset="100%" stop-color="#64748B" />
       </linearGradient>
    <filter id="monogramShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  

  <!-- Minimalist High-Fashion Circular Frame -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#ringGrad)" stroke-width="1.6" filter="url(#monogramShadow)"/>
  <circle cx="250" cy="250" r="217" fill="none" stroke="rgba(226, 232, 240, 0.45)" stroke-width="0.8" stroke-dasharray="2 5"/>

  <!-- Minimalist Cardinal Micro-Diamonds (North, South, East, West) -->
  <g fill="#E2E8F0">
    <polygon points="250,22 252.5,27 250,32 247.5,27" />
    <polygon points="250,468 252.5,473 250,478 247.5,473" />
    <polygon points="468,250 473,247.5 478,250 473,252.5" />
    <polygon points="22,250 27,247.5 32,250 27,252.5" />
  </g>

  <!-- Monogram Glyph Group: Intersecting F & S -->
  <g filter="url(#monogramShadow)">
    
    <!-- ==========================================
         LETTER F (Sleek Modern Luxury Architectural Serif)
         Slender stem, crisp tapered arms, sharp hairlines
         ========================================== -->
    <!-- Vertical Stem with subtle flared base -->
    <!-- Main stem x: 218 to 232, y: 122 to 376 -->
    <path d="
      M 218 126 
      L 232 126 
      L 232 370 
      L 218 370 
      Z" 
      fill="#FFFFFF" />

    <!-- Top Arm of F (tapered modern horizontal) -->
    <path d="
      M 218 126 
      L 338 126 
      C 344 126, 348 129, 350 134 
      L 350 144 
      L 342 144 
      C 336 137, 330 135, 314 135 
      L 232 135 
      L 232 126 
      Z" 
      fill="#FFFFFF" />

    <!-- Middle Crossbar of F (slender, poised) -->
    <path d="
      M 232 234 
      L 298 234 
      C 304 234, 308 236, 310 240 
      L 310 247 
      L 303 247 
      C 298 242, 292 241, 280 241 
      L 232 241 
      Z" 
      fill="#FFFFFF" />

    <!-- Top Left Serif Accent on Stem -->
    <path d="
      M 206 126 
      L 218 126 
      L 218 135 
      C 212 135, 208 133, 206 126 
      Z" 
      fill="#FFFFFF" />

    <!-- Bottom Base Serif Accent on Stem -->
    <path d="
      M 200 370 
      L 250 370 
      L 250 363 
      C 242 363, 237 360, 232 352 
      L 232 370 
      L 218 370 
      L 218 352 
      C 213 360, 208 363, 200 363 
      Z" 
      fill="#FFFFFF" />

    <!-- ==========================================
         LETTER S (Fluid Modern Grace Swirling Through F)
         Curving behind top bar, sweeping forward over middle,
         and curving behind base with high-precision curvature
         ========================================== -->
    <path d="
      M 334 180
      C 328 148, 302 128, 264 128
      C 226 128, 202 144, 202 170
      C 202 192, 222 208, 258 222
      C 306 240, 336 264, 336 310
      C 336 358, 294 388, 235 388
      C 188 388, 154 365, 144 328
      L 165 321
      C 174 350, 200 371, 235 371
      C 280 371, 316 346, 316 309
      C 316 274, 292 254, 248 237
      C 202 219, 180 197, 180 166
      C 180 128, 218 112, 264 112
      C 306 112, 336 130, 345 166
      Z"
      fill="url(#metalGrad)"
      stroke="#080E1C"
      stroke-width="1.2"
      opacity="0.98"
    />

    <!-- Overlapping Intertwine Bridge:
         S passing in FRONT of the middle crossbar of F with razor-sharp knockout definition -->
    <path d="
      M 218 206
      C 232 212, 246 218, 260 224
      C 274 230, 286 237, 296 245
      L 290 258
      C 278 249, 266 242, 252 236
      C 238 230, 226 224, 214 218
      Z"
      fill="url(#metalGrad)"
      stroke="#080E1C"
      stroke-width="1.2"
    />
  </g>
</svg>