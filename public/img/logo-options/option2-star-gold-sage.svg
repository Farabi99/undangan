      stroke="#525A45" 
      stroke-width="1.2"/>

    <!-- Central 8-Point Diamond Celestial Star with Delicate Rays -->
    <g transform="translate(250, 250)">
      <!-- Radiant Hairlines -->
      <line x1="-28" y1="0" x2="-14" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="14" y1="0" x2="28" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="-28" x2="0" y2="-14" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="14" x2="0" y2="28" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Star Shape -->
      <path d="
        M 0 -22 
        L 3.5 -6 
        L 18 -4 
        L 6 3.5 
        L 10 18 
        L 0 8 
        L -10 18 
        L -6 3.5 
        L -18 -4 
        L -3.5 -6 
        Z" 
        fill="url(#goldGrad)"/>
      <circle cx="0" cy="0" r="2.5" fill="#525A45"/>
    </g>

    <!-- Letter S (Right) -->
    <path d="
      M 390 186 
      C 385 162, 368 145, 338 145 
      C 310 145, 292 158, 292 178 
      C 292 196, 308 208, 334 220 
      C 366 234, 392 252, 392 286 
      C 392 328, 358 358, 316 358 
      C 281 358, 254 338, 246 310 
      L 268 302 
      C 274 324, 292 338, 318 338 
      C 348 338, 368 318, 368 288 
      C 368 264, 348 248, 318 234 
      C 286 220, 268 202, 268 174 
      C 268 142, 296 125, 334 125 
      C 364 125, 384 138, 392 160 
