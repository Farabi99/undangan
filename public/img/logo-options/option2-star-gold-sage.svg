      L 214 256 
      L 208 256 
      C 206 246, 202 242, 192 242 
      L 156 242 
      L 156 325 
      C 156 342, 162 346, 178 348 
      L 178 358 
      L 98 358 
      L 98 348 
      C 114 346, 120 342, 120 325 
      L 120 180 
      C 120 163, 114 159, 98 157 
      L 98 145 
      Z" 
