        <stop offset="0%" stop-color="#FFFDF7"/>
        <stop offset="50%" stop-color="#E5C97A"/>
        <stop offset="100%" stop-color="#9E8230"/>
      </linearGradient>
    </defs>
  
  <circle cx="250" cy="250" r="248" fill="#7E836C"/>
  
